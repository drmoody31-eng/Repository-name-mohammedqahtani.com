<!DOCTYPE html>
<html lang="ar" dir="rtl" data-mode="hair">
<head>
<script>window.MQ_SCAN_URL="https://mq-scan.dr-moody31.workers.dev/";</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>فاحص منتجات الشعر والبشرة | د. محمد القحطاني</title>

<meta property="og:url" content="https://mohammedqahtani.com/product-check/">
<meta property="og:image" content="https://mohammedqahtani.com/product-check/media/intro-hf.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Design follows mohammedqahtani.com: ink + ivory with a bronze accent for hair, plum + gold for aesthetics.
   Layout idea: one phone-width column on the dark ink; the five-step oil scale is the recurring figure,
   and verdicts sit on an ivory "paper" card the way the site alternates dark and light sections.
   Single dark theme by choice, like the site itself. */
:root{
  color-scheme:dark;
  --ink:#070a0e; --ink-2:#0c1118; --ink-3:#111923;
  --ivory:#f3efe7; --paper:#f8f5ef; --paper-2:#e9e4db;
  --muted:#aab3bd; --muted-light:#646a70;
  --line:rgba(255,255,255,.13); --line-light:rgba(7,10,14,.14);
  --accent:#c59a6c; --accent-soft:#dfc3a1; --accent-deep:#8a6238;
  --good:#7cc4a1; --warn:#e0b25e; --bad:#e58a73;
  --good-p:#2c7a57; --warn-p:#946512; --bad-p:#a8402f;
  --img-bg:#030a12;
  --r-sm:12px; --r-md:22px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-ar:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  --font-en:"Manrope",Arial,sans-serif;
  --font-display:"Alexandria","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
}
:root[data-mode="skin"]{
  --ink:#1f1226; --ink-2:#2a1833; --ink-3:#352040;
  --ivory:#f9f5f2; --paper:#f9f5f2; --paper-2:#ece3e8;
  --muted:#bfb0c6; --muted-light:#6c5f72;
  --line-light:rgba(31,18,38,.14);
  --accent:#d4b06a; --accent-soft:#e9d6a6; --accent-deep:#85651f;
  --img-bg:#21051b;
}
*{box-sizing:border-box}
html{background:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;transition:background .5s ease}
body{margin:0;min-width:320px;background:var(--ink);color:var(--ivory);font-family:var(--font-ar);font-size:17px;line-height:1.75;transition:background .5s ease}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
p,h1,h2,h3,dl,dd,ul{margin:0;padding:0}
ul{list-style:none}
::selection{color:var(--ink);background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
.en{font-family:var(--font-en);direction:ltr;unicode-bidi:isolate}

.app{max-width:560px;margin:0 auto;padding:0 20px 56px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:76px}
.brand{display:inline-flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:start}
.brand-symbol{position:relative;flex:none;width:32px;aspect-ratio:1;border:1px solid currentColor;border-radius:50%;opacity:.92}
.brand-symbol::before,.brand-symbol::after{content:"";position:absolute;background:currentColor;opacity:.75}
.brand-symbol::before{width:1px;height:58%;inset:21% 50% auto auto}
.brand-symbol::after{height:1px;width:58%;inset:50% auto auto 21%}
.brand-name{display:block;font-size:15px;font-weight:500;line-height:1.2}
.brand-role{display:block;margin-top:5px;font-family:var(--font-en);font-size:8px;letter-spacing:.19em;text-transform:uppercase;opacity:.62;direction:ltr;text-align:right}
.switch{display:inline-flex;align-items:center;padding:3px;border:1px solid currentColor;border-radius:999px;opacity:.95}
.switch button{border:0;background:transparent;border-radius:999px;padding:7px 15px;font-size:13px;line-height:1.3;transition:background .3s ease,color .3s ease}
.switch button[aria-pressed="true"],.switch button[aria-selected="true"]{background:var(--accent);color:var(--ink);font-weight:600}

main{display:flex;flex-direction:column;gap:26px;padding-top:22px;animation:rise .5s var(--ease)}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.micro{display:inline-flex;align-items:center;gap:11px;color:var(--accent-soft);font-size:13px;letter-spacing:.02em}
.micro::before{content:"";width:28px;height:1px;background:var(--accent)}
.kicker{color:var(--accent);font-size:13px;font-weight:600;letter-spacing:.04em}
h1{font-weight:300;font-size:clamp(40px,11.5vw,54px);line-height:1.2;text-wrap:balance}
h1 em,h2 em{font-style:normal;color:var(--accent-soft)}
h2{font-weight:300;font-size:clamp(30px,8.4vw,38px);line-height:1.3;text-wrap:balance}
h3{font-family:var(--font-display);font-weight:700;font-size:19px;line-height:1.5}
.lead{color:#c3c8ce;font-size:17px;font-weight:300;line-height:1.85}
.muted{color:var(--muted)}
.small{font-size:14px;line-height:1.7}

/* oil scale */
.scale{display:flex;flex-direction:column;gap:12px}
.scale-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.scale-head b{font-weight:500;color:var(--accent-soft)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--img-bg)}
.tile{position:relative;transition:opacity .5s ease,filter .5s ease}
.tile img{width:100%;height:auto}
.scale.has-level .tile{opacity:.5;filter:saturate(.7)}
.scale.has-level .tile.on{opacity:1;filter:none}
.tile.on::after{content:"";position:absolute;inset:0;border:2px solid var(--accent);pointer-events:none}
.tile:first-child.on::after{border-radius:0 20px 20px 0}
.tile:last-child.on::after{border-radius:20px 0 0 20px}
.tile .here{position:absolute;inset-block-start:10px;inset-inline:0;margin:auto;width:max-content;max-width:94%;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--ink);font-size:11px;font-weight:600;line-height:1.6}
.ticks{display:grid;grid-template-columns:repeat(5,1fr);text-align:center;font-size:12px;line-height:1.45;color:var(--muted)}
.ticks span{padding:0 2px}
.ticks span::before{content:"";display:block;width:7px;height:7px;margin:0 auto 7px;border-radius:50%;border:1px solid var(--muted);opacity:.7}
.ticks .on{color:var(--ivory);font-weight:600}
.ticks .on::before{background:var(--accent);border-color:var(--accent);opacity:1}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:56px;padding:14px 24px;border:0;border-radius:999px;background:var(--ivory);color:var(--ink);font-size:17px;font-weight:500;transition:transform .35s var(--ease),background .3s ease}
.btn:hover{transform:translateY(-1px);background:#fff}
.btn .arr{font-family:var(--font-en);transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(-4px)}
.btn.line{background:transparent;color:var(--ivory);border:1px solid var(--line)}
.btn.line:hover{background:rgba(255,255,255,.05)}
.btn.fit{width:auto;min-height:46px;padding:9px 22px;font-size:15px}
.text-btn{align-self:flex-start;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.32);padding:6px 2px;font-size:15px;opacity:.82}
.text-btn:hover{opacity:1;border-color:var(--accent)}
.text-btn.dark{border-bottom-color:var(--line-light);color:var(--muted-light);font-size:14px;opacity:1}
.actions{display:flex;flex-direction:column;gap:14px}

/* numbered rows, quiz options, lists: thin ruled rows as on the site */
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:baseline;gap:16px;padding:16px 2px;border-bottom:1px solid var(--line)}
.idx{flex:none;font-family:var(--font-en);font-size:10px;letter-spacing:.15em;color:var(--muted);direction:ltr}
.count{font-family:var(--font-en);font-size:11px;letter-spacing:.15em;color:var(--muted);direction:ltr;text-align:right}
.count b{color:var(--accent);font-weight:500}
.bar{height:1px;background:var(--line)}
.bar i{display:block;height:1px;background:var(--accent);transition:width .45s var(--ease)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:19px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;font-size:18px;line-height:1.6;transition:padding .35s var(--ease),color .3s ease}
.opt .arr{font-family:var(--font-en);color:var(--muted);transition:transform .35s var(--ease),color .3s ease}
.opt:hover{padding-inline-start:10px;color:var(--accent-soft)}
.opt:hover .arr{color:var(--accent);transform:translateX(-4px)}
dl.facts{border-top:1px solid var(--line)}
dl.facts div{display:grid;grid-template-columns:104px 1fr;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line)}
dl.facts dt{font-size:13px;color:var(--muted);padding-top:3px}
dl.facts dd{font-size:16px}
.cols{display:grid;gap:22px}
.pm li{display:flex;gap:12px;padding:6px 0;font-size:16px}
.pm li::before{font-family:var(--font-en);font-weight:600;flex:none;width:12px;text-align:center}
.pm.plus li::before{content:"+";color:var(--good)}
.pm.minus li::before{content:"−";color:var(--bad)}

/* product check */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border:1px solid var(--line);border-radius:999px}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 4px;font-size:14px;transition:background .3s ease,color .3s ease}
.seg button[aria-selected="true"]{background:var(--ivory);color:var(--ink);font-weight:600}
.drop{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 20px;border:1.5px dashed var(--accent);border-radius:var(--r-md);text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));cursor:pointer}
.drop.static{cursor:default}
.drop svg{width:44px;height:44px;stroke:var(--accent);fill:none;stroke-width:1.2}
.pulse{width:44px;height:44px;border-radius:50%;border:1px solid var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.field{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 2px;font-size:17px}
.field::placeholder{color:var(--muted);opacity:.8}
select.field{appearance:none;background:var(--ink-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px}
textarea.field{min-height:132px;border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;direction:ltr;text-align:left;font-family:var(--font-en);font-size:15px;line-height:1.6;resize:vertical}
label.small{display:block;margin-bottom:6px}
.plist{max-height:440px;overflow:auto;border-top:1px solid var(--line)}
.pitem{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:15px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:start;transition:padding .35s var(--ease)}
.pitem:hover{padding-inline-start:10px}
.pname{font-family:var(--font-en);font-size:15px;font-weight:500;line-height:1.45;direction:ltr;unicode-bidi:isolate;text-align:right}
.pname small{display:block;font-family:var(--font-ar);font-size:13px;font-weight:400;color:var(--muted);direction:rtl}
.cat{flex:none;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;line-height:1.5;color:var(--muted);white-space:nowrap}
.err{padding:14px 16px;border:1px solid var(--bad);border-radius:var(--r-sm);font-size:15px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}

/* verdict on paper */
.paper{background:var(--paper);color:var(--ink);border-radius:var(--r-md);padding:26px 22px;display:flex;flex-direction:column;gap:20px}
.paper .kicker{color:var(--accent-deep)}
.paper .pname{font-size:19px;font-weight:600;text-align:right}
.score{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.num{font-family:var(--font-en);font-weight:300;font-size:86px;line-height:.9;letter-spacing:-.05em;font-variant-numeric:tabular-nums;direction:ltr}
.num small{font-size:15px;letter-spacing:0;color:var(--muted-light);margin-inline-start:4px}
.verdict{padding:6px 18px;border-radius:999px;border:1.5px solid currentColor;font-family:var(--font-display);font-weight:700;font-size:17px;white-space:nowrap}
.good{color:var(--good-p)} .warn{color:var(--warn-p)} .bad{color:var(--bad-p)}
.meter{height:4px;border-radius:4px;background:var(--paper-2);overflow:hidden;direction:ltr}
.meter i{display:block;height:100%;border-radius:4px;background:currentColor}
.reasons{border-top:1px solid var(--line-light)}
.reasons li{display:grid;grid-template-columns:18px 1fr;gap:10px;padding:13px 0;border-bottom:1px solid var(--line-light);font-size:16px;line-height:1.65}
.reasons .sign{font-family:var(--font-en);font-weight:700;font-size:18px;line-height:1.45;text-align:center}
.reasons small{display:block;margin-top:2px;font-size:12px;color:var(--muted-light)}
.paper .note{font-size:13px;line-height:1.7;color:var(--muted-light)}
.alt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line)}
.alt .s{font-family:var(--font-en);color:var(--good);font-weight:600;font-variant-numeric:tabular-nums}
.code{flex:none;display:inline-flex;flex-direction:column;align-items:center;padding:6px 14px;border:1.5px dashed var(--accent);border-radius:999px;font-family:var(--font-en);font-size:13px;font-weight:600;letter-spacing:.06em;line-height:1.3;direction:ltr}
footer{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;line-height:1.8;color:var(--muted)}
@media (min-width:520px){.cols{grid-template-columns:1fr 1fr}}
@media (max-width:360px){.num{font-size:70px}.switch button{padding:7px 11px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* visitor choice, intro video, type photo, pharmacy picks */
.who{display:flex;flex-direction:column;gap:14px}
.who-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{min-height:88px;border:1px solid var(--line);border-radius:var(--r-md);background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));font-size:22px;font-weight:300;transition:border-color .3s ease,transform .35s var(--ease),background .3s ease}
.choice:hover{border-color:var(--accent);transform:translateY(-2px);background:rgba(255,255,255,.08)}
.shot{position:relative;margin:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--img-bg);aspect-ratio:1}
.shot video,.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot figcaption{position:absolute;inset:auto 0 0 0;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:44px 18px 14px;background:linear-gradient(to top,rgba(0,0,0,.72),transparent);font-family:var(--font-display);font-weight:700;font-size:19px}
.shot figcaption small{font-family:var(--font-ar);font-weight:400;font-size:12px;opacity:.75;white-space:nowrap}
.picks{display:flex;flex-direction:column;gap:12px}
.pick{display:flex;flex-direction:column;gap:6px;padding:18px;border:1px solid var(--line);border-radius:var(--r-md);background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.02));color:inherit;text-decoration:none;transition:border-color .3s ease,transform .35s var(--ease)}
.pick:hover{border-color:var(--accent);transform:translateY(-2px)}
.pick .slot{font-size:13px;color:var(--accent-soft)}
.pick .slot .s{font-family:var(--font-en);color:var(--good)}
.pick .pname{font-size:16px;font-weight:600}
.pick .why{font-size:14px;line-height:1.65;color:var(--muted)}
.pick .buy{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding-top:12px;border-top:1px solid var(--line)}
.pick .go{font-size:15px;font-weight:500}
.pick .go .arr{font-family:var(--font-en);display:inline-block;transition:transform .35s var(--ease)}
.pick:hover .go .arr{transform:translateX(-4px)}
.code.soon{font-family:var(--font-ar);font-size:12px;font-weight:400;letter-spacing:0;direction:rtl;opacity:.8}
#toast{position:fixed;inset:auto 0 22px 0;margin:auto;width:max-content;max-width:calc(100% - 40px);padding:11px 20px;border-radius:999px;background:var(--ivory);color:var(--ink);font-size:15px;font-weight:500;box-shadow:0 12px 40px rgba(0,0,0,.4);z-index:5}

.sitelinks{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;margin:0 0 14px}.sitelinks a{color:var(--accent);font-weight:600;text-decoration:none;font-size:15px}.sitelinks a:hover{text-decoration:underline}

.actions.two .btn{display:flex;align-items:center;justify-content:space-between;gap:14px;text-align:start;padding:16px 22px;height:auto;white-space:normal}.actions.two .btn>span{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:18px;line-height:1.35}.actions.two .btn small{font-weight:400;font-size:14px;line-height:1.55;opacity:.78}.actions.two .btn .arr{flex:none}.actions.two .btn{border-radius:22px}

/* simpler layout: folds, verdict sentence, single check screen */
.folds{border-top:1px solid var(--line)}
.fold{border-bottom:1px solid var(--line)}
.fold summary{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 2px;font-size:17px;font-weight:500;cursor:pointer;list-style:none}
.fold summary::-webkit-details-marker{display:none}
.fold summary i{font-style:normal;font-family:var(--font-en);font-size:12px;color:var(--ink);background:var(--accent);border-radius:999px;padding:1px 8px;margin-inline-start:6px}
.fold summary b{font-family:var(--font-en);font-weight:300;font-size:26px;line-height:1;color:var(--accent);transition:transform .3s var(--ease)}
.fold[open] summary b{transform:rotate(45deg)}
.fold-body{padding:2px 0 22px;display:flex;flex-direction:column;gap:14px}
.fold-body dl.facts{border-top:0}
.pm.big li{font-size:18px;padding:9px 0}
.minor{display:flex;flex-wrap:wrap;gap:10px 26px}
.shot.wide{aspect-ratio:16/10}
.find{display:flex;flex-direction:column;gap:10px}
.find .or{align-self:center;font-size:14px;color:var(--muted)}
.find .field{border:1px solid var(--line);border-radius:999px;padding:14px 20px}
.plist:empty{display:none}
.say{display:flex;flex-direction:column;gap:6px}
.say strong{font-family:var(--font-display);font-weight:700;font-size:clamp(34px,10vw,44px);line-height:1.25}
.say p{font-size:18px;line-height:1.65;color:var(--ink)}
.score{align-items:baseline}
.score .lbl{font-size:14px;color:var(--muted-light)}
.num{font-size:44px}
@media (max-width:360px){.num{font-size:40px}}

.say .approx{align-self:flex-start;padding:2px 12px;border:1px solid currentColor;border-radius:999px;font-size:13px;font-weight:600}

/* tiers, tags, multi-select, code chip */
.tier{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tier button{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:start;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-md);background:transparent;color:inherit;transition:background .3s ease,border-color .3s ease}
.tier button b{font-size:17px;font-weight:600}
.tier button small{font-size:14px;color:var(--muted);line-height:1.5}
.tier button[aria-pressed="true"]{background:var(--ivory);border-color:var(--ivory);color:var(--ink)}
.tier button[aria-pressed="true"] small{color:var(--ink);opacity:.72}
.pick .slot{display:flex;align-items:center;gap:8px;font-size:14px}
.tag{font-style:normal;font-size:12px;line-height:1.5;padding:1px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.core{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.code{flex-direction:column;cursor:pointer;gap:0}
.code small{font-family:var(--font-ar);font-size:11px;font-weight:400;letter-spacing:0;opacity:.8;direction:rtl}

    }

  }
  if (b.dataset.tab) { S.tab = b.dataset.tab; S.q = ""; S.err = ""; S.errName = ""; S.errSwitch = false; render(); return; }
  if (b.dataset.prod != null) { var pr = LIST[+b.dataset.prod]; if (!pr) return; S.result = { prod: pr, src: pr.cur ? "تقييم آلي من قاعدة منتجاتنا حسب نتيجتك." : "حللنا قائمة مكوناته المسجلة في قاعدة منتجاتنا." }; go("result"); return; }
  var a = b.dataset.a;
  if (a === "quiz") { S.after = null; S.gq = !S.gender; S.step = 0; S.answers = {}; go("quiz"); }

    if (!ck.ok) { S.err = W(ck.why === "short" ? "المعلومات المتوفرة ما تكفي للحكم. نحتاج قائمة المكونات كاملة عشان نعطيك نتيجة دقيقة." : "ما قدرنا نقرأ قائمة مكونات واضحة. الصق المكونات كاملة بالإنجليزي مثل ما هي مكتوبة على العلبة، أو صوّر ظهر العلبة بوضوح."); S.errName = ""; S.errSwitch = false; render(); return; }
    var same = matchInci(txt, S.mode);
    S.result = same ? { prod: same, src: "هذي تركيبة " + same.n + " المسجلة عندنا." } : { prod: { n: "منتجك (" + M().cats[cat] + ")", c: cat, f: analyzeIngredients(txt, cat, S.mode, "") }, src: "حللنا المكونات اللي لصقتها." }; go("result");
  }
});
V.addEventListener("input", function (e) { if (e.target.id === "q") { S.q = e.target.value; document.getElementById("plist").innerHTML = listHTML(); } });
V.addEventListener("change", function (e) { if (e.target.id === "photo" && e.target.files[0]) scan(e.target.files[0]); });

/* ---------- photo: recognise the product, then look it up ---------- */
function shrink(file) {
  return new Promise(function (res, rej) {
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function () {
      var k = Math.min(1, 1500 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(function (b) { b ? res(b) : rej(new Error("blob")); }, "image/jpeg", 0.85);
    };
    img.onerror = function () { rej(new Error("image")); }; img.src = u;
  });
}
function promptFor(mode) {
  var MM = MODES[mode];
  return 'You identify a cosmetic product from a photo for a product-suitability tool. Reply with ONE JSON object and nothing else:\n' +
    '{"readable":true|false,"domain":"hair|skin|other","brand":"brand in English","name":"product name in English as printed, without the brand","category":"' + Object.keys(MM.cats).join("|") + '|other","ingredients":"the ingredient (INCI) list copied from the photo if it is visible, else empty","known_ingredients":"see below","confidence":"high|medium|low","texture":[...],"traits":[...]}\n' +
    'domain: "hair" for hair or scalp products, "skin" for face or body skincare, "other" for anything else. This request is for ' + mode + ' products; if the product belongs to the other domain still fill brand, name and domain.\n' +
    'known_ingredients: only when the ingredient list is NOT visible in the photo. If you recognise this exact product and reliably know its published ingredient list, write that full INCI list in order, comma separated, and set confidence to "high" (you are sure of the list) or "medium" (sure of the main ingredients, less sure of the order or the tail). If you do not reliably know this exact product\'s formula, leave it empty and set confidence "low". Do not guess and do not substitute a different product from the same brand.\n' +
    'texture: any of ' + (mode === "skin" ? '"light" (gel, fluid, lotion or oil-free), "rich" (thick cream, balm or ointment), "matte", "foam" (foaming cleanser), "gentle" (cream, milk or micellar cleanser), "mineral" (mineral-only sunscreen)' : '[] (leave empty)') + ' that clearly apply to this product.\n' +
    'traits: used for an approximate rating when the formula is not known. From this list, include every trait that applies to this product according to the claims printed on the pack and what you know about this product line: ' + MM.flagGuide + '.' + (mode === "hair" ? ' For a shampoo always include either "ss" or "mild".' : '') + ' Include only traits you are reasonably sure of.\n' +
    'If nothing is legible or it is not a cosmetic product, set readable false. Never invent a brand or a name.';
}
function parseJSON(t) {
  t = String(t || ""); var m = t.match(/\{[\s\S]*\}/);
  if (m) { try { return JSON.parse(m[0]); } catch (e) {} }

  var str = function (k) { var x = t.match(new RegExp('"' + k + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)')); return x ? x[1].replace(/\\"/g, '"') : ""; };
  var arr = function (k) { var x = t.match(new RegExp('"' + k + '"\\s*:\\s*\\[([^\\]]*)')); return x ? (x[1].match(/"(\w+)"/g) || []).map(function (v) { return v.replace(/"/g, ""); }) : []; };
  if (!/"readable"\s*:\s*true/.test(t) || !(str("brand") || str("name"))) return null;
  var known = str("known_ingredients");
  return { readable: true, domain: str("domain"), brand: str("brand"), name: str("name"), category: str("category"), ingredients: str("ingredients"), known_ingredients: known, confidence: known ? "medium" : "low", texture: arr("texture"), traits: arr("traits") };
}
function guessCat(name, mode) {
  var n = String(name).toLowerCase(), R = mode === "skin"
    ? [["sunscreen", /spf|sun ?(screen|block)|uv/], ["cleanser", /cleans|wash|foam|micellar/], ["eye", /\beye/], ["mask", /mask|peel/], ["toner", /toner|tonic|mist|essence/], ["serum", /serum|ampoule|concentrate|corrector|booster|retinol|depigment|spot|treatment|acid/], ["moisturizer", /cream|creme|lotion|moistur|balm|emulsion|fluid|gel|emollient/]]
    : [["shampoo", /shampoo/], ["conditioner", /conditioner/], ["mask", /mask|masque/], ["oil", /\boil\b/], ["scalp", /scalp|tonic|lotion|scrub/], ["serum", /serum|ampoule/], ["leavein", /leave|cream|milk|spray|protect/], ["styling", /gel|wax|mousse|foam|styl/]];
  for (var i = 0; i < R.length; i++) if (R[i][1].test(n)) return R[i][0];
  return "";
}
var TEXTURE = { light: 1, rich: 1, matte: 1, foam: 1, gentle: 1, mineral: 1 };
function scanKey(mode, name) { return mode + "-" + norm(name).replace(/%/g, "").replace(/\s+/g, "-").slice(0, 110); }
function withTimeout(p, ms) { return Promise.race([p, new Promise(function (res) { setTimeout(function () { res(null); }, ms); })]); }
function cacheGet(key) {
  if (!store) return Promise.resolve(null);
  try { return withTimeout(store.doc("scans/" + key).get().then(function (sn) { return sn && sn.exists ? sn.data() : null; }).catch(function () { return null; }), 4000); } catch (e) { return Promise.resolve(null); }
}
function cachePut(coll, key, body) { if (!store) return; try { store.doc(coll + "/" + key).set(body).catch(function () {}); } catch (e) {} }
/* decide where the ingredients come from: the photo itself, our base, an earlier scan, or the known formula */
function resolveScan(j, mode, skipBase) {
  var MM = MODES[mode], other = mode === "hair" ? "skin" : "hair";
  if (!j || !j.readable) return Promise.resolve({ err: "ما قدرنا نقرأ المنتج من الصورة. صوّر الواجهة أو قائمة المكونات عن قرب وبإضاءة واضحة." });
  if (j.domain === other) return Promise.resolve({ err: COPY[mode].other, sw: true });
  var full = ((j.brand || "") + " " + (j.name || "")).trim(), cat = j.category, db = null;
  if (!MM.cats[cat]) {
    if (j.domain !== mode && j.domain) return Promise.resolve({ err: "هذا النوع من المنتجات ما نفحصه حالياً." });
    db = skipBase ? null : matchProduct(full, mode, null);
    cat = db ? db.c : guessCat(full, mode);
    if (!MM.cats[cat]) return Promise.resolve({ err: "هذا النوع من المنتجات ما نفحصه حالياً." });
  }
  if (!db) db = skipBase ? null : matchProduct(full, mode, cat);
  if (j.ingredients && checkIngredients(j.ingredients).ok) {
    var mi = matchInci(j.ingredients, mode);
    return Promise.resolve({ result: mi ? { prod: mi, src: "قرأنا قائمة المكونات من الصورة، وهي تركيبة " + mi.n + " المسجلة عندنا." } : { prod: { n: db && !db.inci ? db.n : (full || "منتجك"), c: cat, f: analyzeIngredients(j.ingredients, cat, mode, full) }, src: "قرأنا قائمة المكونات من الصورة وحللناها." } });
  }
  if (db) return Promise.resolve({ result: { prod: db, src: "تعرّفنا على المنتج وجبنا مكوناته من قاعدة منتجاتنا.", scan: j, matched: true } });
  if (!full) return Promise.resolve({ err: "ما قدرنا نقرأ اسم المنتج. صوّر الواجهة عن قرب، أو صوّر قائمة المكونات من ظهر العلبة." });
  var key = scanKey(mode, full);
  return cacheGet(key).then(function (hit) {
    if (hit && hit.flags && MM.cats[hit.cat]) return { result: { prod: { n: hit.name || full, c: hit.cat, f: hit.flags.slice() }, src: "تعرّفنا على المنتج وجبنا مكوناته من قاعدة منتجاتنا." } };
    var known = String(j.known_ingredients || "");
    if (j.confidence !== "low" && checkIngredients(known).ok) {
      var f = analyzeIngredients(known, cat, mode, full);
      (j.texture || []).forEach(function (x) { if (TEXTURE[x] && f.indexOf(x) < 0) f.push(x); });
      f = MM.finishFlags(f, cat);
      cachePut("scans", key, { mode: mode, name: full, cat: cat, flags: f, conf: j.confidence || "medium", ings: known.slice(0, 4000), status: "auto", at: new Date().toISOString() });
      return { result: { prod: { n: full, c: cat, f: f }, src: "تعرّفنا على المنتج وحللنا تركيبته المعروفة.", note: j.confidence === "high" ? "" : "لو تبي تتأكد أكثر، صوّر قائمة المكونات من ظهر العلبة." } };
    }
    var okf = {}; (MM.flagGuide.match(/"(\w+)"/g) || []).forEach(function (x) { okf[x.replace(/"/g, "")] = 1; });
    var tr = []; (Array.isArray(j.traits) ? j.traits : []).forEach(function (x) { if (okf[x] && tr.indexOf(x) < 0) tr.push(x); });
    (j.texture || []).forEach(function (x) { if (TEXTURE[x] && tr.indexOf(x) < 0) tr.push(x); });
    if (tr.filter(function (x) { return x !== "frag" && x !== "fragfree"; }).length) {
      cachePut("misses", key, { mode: mode, name: full, cat: cat, traits: tr, at: new Date().toISOString() });
      return { result: { prod: { n: full, c: cat, f: MM.finishFlags(tr, cat) }, approx: true, src: "حللناه حسب المكتوب على العلبة واللي نعرفه عن المنتج." } };
    }
    cachePut("misses", key, { mode: mode, name: full, cat: cat, at: new Date().toISOString() });
    return { err: "تعرّفنا على المنتج. عشان نحلله بدقة، صوّر قائمة المكونات من ظهر العلبة.", name: full };
  });
}
function finishScan(j, mode, skipBase) {
  return resolveScan(j, mode, skipBase).then(function (out) {
    S.busy = false; if (S.mode !== mode) return;
    if (out.err) { S.err = out.err; S.errName = out.name || ""; S.errSwitch = !!out.sw; S.view = "check"; render(); return; }
    S.result = out.result; go("result");
  });
}
function scan(file) {
  if (!sampler) return; var mode = S.mode; S.busy = true; S.err = ""; S.errName = ""; S.errSwitch = false; render();
  shrink(file).then(function (blob) { return sampler(promptFor(mode), { images: [blob], cache: false, mode: mode }); }).then(function (r) {
    if (S.mode !== mode) { S.busy = false; return; }
    return finishScan(parseJSON(r.text), mode, false);
  }).catch(function (err) {
    S.busy = false; if (err && err.code === "not_granted") { canPhoto = false; }
    S.err = err && err.code === "daily_limit" ? W("وصلت حد الفحص بالصور لليوم. ابحث عن المنتج بالاسم أو جرّب بكرة.") : err && err.code === "rate_limited" ? "فيه ضغط حالياً، جرّب بعد دقيقة." : W("ما قدرنا نحلل الصورة. جرّب مرة ثانية أو اكتب اسم المنتج."); render();
  });
}

/* ---------- boot ---------- */
/* #hair / #skin open that section; #hair-scan / #skin-scan go straight to checking a product (asking the type questions first if needed) */
function scanIntent() { if (P()) { S.after = null; S.view = "check"; } else { S.after = "check"; S.gq = !S.gender; S.step = 0; S.answers = {}; S.view = "quiz"; } }
function fromHash() {
  var h = location.hash.replace("#", ""), scan = /-scan$/.test(h), m = h.replace(/-scan$/, "");
  if (!MODES[m]) return;
  if (m !== S.mode) setMode(m);
  if (scan) { scanIntent(); render(); }
}
window.addEventListener("hashchange", fromHash);
var h0 = location.hash.replace("#", ""), scan0 = /-scan$/.test(h0); h0 = h0.replace(/-scan$/, ""); if (MODES[h0]) { S.mode = h0; }
setMode(S.mode, true); if (scan0 && MODES[h0]) scanIntent(); render();
if (window.claude && window.claude.use) {
  window.claude.use("sample").then(function (s) {
    if (!s) return; sampler = s;
    return Promise.resolve(s.limits ? s.limits() : { images: true }).then(function (l) { canPhoto = !!(l && l.images); if (S.view === "check") render(); });
  }).catch(function () {});
  window.claude.use("db").then(function (d) { store = d || null; }).catch(function () {});

  }).catch(function () {});
}
